name: Offline release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      MPLBACKEND: Agg
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python scripts/verify_release_assets.py
      - run: python scripts/run_release_tests.py --group core --report outputs/core-tests.json
      - run: python examples/offline_identity.py
      - run: python examples/offline_api.py
      - run: python scripts/reproduce_paper_results.py --output outputs/reproduced
      - name: Keep offline verification outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: offline-checks-${{ matrix.os }}
          path: outputs/
          if-no-files-found: ignore
